<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>导出数据检查</title>
<style>
  :root {
    color-scheme: light dark;
    font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --bg: #f5f5f7; --surface: #fff; --text: #1d1d1f; --muted: #65656b;
    --line: #e5e5ea; --accent: #006edb; --focus: #147ce5; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111215; --surface: #1c1d21; --text: #f5f5f7; --muted: #a0a0a8;
      --line: #35363b; --accent: #76b6ff; --focus: #76b6ff; --error: #ff9b91; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  button, select, input { font: inherit; }
  button, select { min-height: 38px; }
  button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }
  .app { width: min(1680px, calc(100% - 40px)); margin: 0 auto; padding: 24px 0 32px; }
  .masthead { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 15px; }
  .eyebrow { color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 4px; }
  h1 { font-size: 26px; letter-spacing: -.03em; line-height: 1.2; margin: 0; }
  h2 { font-size: 18px; letter-spacing: -.02em; margin: 0; }
  h3 { font-size: 16px; margin: 0; }
  .field { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  select { max-width: 330px; padding: 6px 34px 6px 12px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--surface); color: var(--text); cursor: pointer; }
  #episode { width: min(330px, 42vw); }
  .task { display: flex; align-items: baseline; gap: 11px; margin: 0 0 17px; min-height: 24px; }
  .task span { flex: none; color: var(--muted); font-size: 13px; }
  .task strong { font-size: 16px; font-weight: 600; line-height: 1.4; }
  .transport { display: flex; align-items: center; gap: 16px; padding: 13px 16px; margin-bottom: 20px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  #play { flex: none; padding: 7px 16px; border: 0; border-radius: 9px; background: var(--accent); color: #fff;
    font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { #play { color: #101b29; } }
  .scrub { flex: 1; min-width: 0; }
  #timeline { width: 100%; margin: 2px 0 5px; accent-color: var(--accent); cursor: pointer; }
  .scrub-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  #time { font-variant-numeric: tabular-nums; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1.07fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .surface { min-width: 0; padding: 17px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 14px; }
  #camera-name { color: var(--muted); font-size: 14px; font-weight: 500; margin-left: 8px; }
  .camera { display: block; width: 100%; padding: 0; text-align: left; border: 0; background: transparent; color: inherit; }
  .camera img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #0b1018; border-radius: 9px; }
  .camera.primary { cursor: default; }
  .camera.primary:disabled { opacity: 1; color: inherit; }
  .camera-title { display: block; margin: 7px 0 0; font-weight: 600; }
  .camera.primary .camera-title { display: none; }
  .camera .detail { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .camera.secondary .detail { display: none; }
  .filmstrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
  .filmstrip:empty { display: none; }
  .camera.secondary { cursor: pointer; border-radius: 10px; }
  .camera.secondary img { border: 2px solid transparent; }
  .camera.secondary:hover img { border-color: var(--accent); }
  .pose + .pose { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 18px; }
  .pose-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
  .quiet { border: 0; background: transparent; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 6px; }
  .pose-viewport { position: relative; }
  .pose canvas { display: block; width: 100%; height: clamp(260px, 31vh, 350px); border-radius: 9px; touch-action: none; cursor: grab; }
  .pose canvas:active { cursor: grabbing; }
  .pose-empty { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aabbd0; font-size: 14px; pointer-events: none; }
  .pose-meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 8px; color: var(--muted);
    font-size: 12px; font-variant-numeric: tabular-nums; }
  .guide { margin: 16px 0 0; color: var(--muted); font-size: 13px; }
  .guide summary { width: fit-content; cursor: pointer; }
  .guide p { max-width: 900px; line-height: 1.6; margin: 8px 0 0; }
  #error { color: var(--error); margin: 0 0 12px; white-space: pre-wrap; }
  #error:empty { display: none; }
  @media (max-width: 1050px) { .workspace { grid-template-columns: 1fr; } .poses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .pose + .pose { border: 0; margin: 0; padding: 0; } }
  @media (max-width: 680px) { .app { width: min(100% - 24px, 520px); padding-top: 18px; } .masthead { align-items: start; flex-direction: column; }
    #episode { width: min(100%, 340px); } .transport { gap: 10px; padding: 10px; } .surface { padding: 12px; }
    .poses { grid-template-columns: 1fr; } .pose + .pose { border-top: 1px solid var(--line); padding-top: 16px; }
    .filmstrip { display: flex; overflow-x: auto; } .filmstrip .camera { flex: 0 0 150px; } }
</style>
<div class="app">
  <header class="masthead">
    <div><p class="eyebrow">Robot Data Hub</p><h1>导出数据检查</h1></div>
    <label class="field" for="episode">Episode <select id="episode"></select></label>
  </header>
  <p class="task"><span>当前指令</span><strong id="instruction" aria-live="polite">正在读取…</strong></p>
  <div class="transport">
    <button id="play" type="button" aria-label="播放">▶ 播放</button>
    <div class="scrub">
      <input id="timeline" aria-label="Episode 时间轴" type="range" min="0" max="1000" value="0">
      <div class="scrub-label"><span>时间轴</span><output id="time">0.000 s</output></div>
    </div>
  </div>
  <p id="error" role="alert"></p>
  <main class="workspace">
    <section class="surface" aria-labelledby="video-title">
      <div class="panel-heading"><h2 id="video-title">视频 <span id="camera-name"></span></h2></div>
      <div id="primaryCamera"></div><div id="otherCameras" class="filmstrip"></div>
    </section>
    <section class="surface" aria-labelledby="state-title">
      <div class="panel-heading"><h2 id="state-title">末端位姿</h2></div>
      <div class="poses" id="poses"></div>
    </section>
  </main>
  <details class="guide"><summary>视图说明</summary>
    <p>彩色短线是当前 TCP 前的运动轨迹，白球中心是当前 TCP；红 X、绿 Y、蓝 Z 是工具轴，白色实体夹指示意夹爪开合。视图使用透视、光照和前后遮挡帮助判断三维朝向，夹指与坐标轴的尺寸仅作示意。拖动位姿视图可旋转，滚轮可缩放。相机和各状态流按同一个 episode 时钟选择最近的已采样值。默认从各臂起始工具的后上方向前看，近似第一人称视角；重置视角会恢复此方向。导出数据没有相机外参，因此它不是经过标定的视频叠加。</p>
  </details>
</div>
<script type="module">
import {Pose3D} from '/pose3d.js';
const $ = id => document.getElementById(id);
let data = null, currentNs = 0, playing = false, lastTick = 0, generation = 0;
let poseViews = {}, cameraCards = {};
const seconds = ns => (ns / 1e9).toFixed(3) + ' s';
function setPlaying(value) {
  playing = value; lastTick = 0;
  $('play').textContent = playing ? '❚❚ 暂停' : '▶ 播放';
  $('play').setAttribute('aria-label', playing ? '暂停' : '播放');
}
function sampleIndex(times, target) {
  let lo = 0, hi = times.length;
  while (lo < hi) { const mid = (lo + hi) >>> 1; if (times[mid] <= target) lo = mid + 1; else hi = mid; }
  return lo - 1;
}
function frameUrl(id, camera, index, width) {
  return `/api/frame?id=${encodeURIComponent(id)}&camera=${encodeURIComponent(camera)}&index=${index}&width=${width}`;
}
// 通用相机排序：俯视/全局视角优先，腕部/鱼眼靠后。用词根正则匹配，
// 不依赖某个数据集的具体命名，越像“看全局”的相机越适合当主视图。
const CAMERA_HINTS = [
  [/top|overhead|bird|global|high/, 100],
  [/head/, 50], [/front/, 20],
  [/wrist|hand|gripper/, -100], [/fisheye/, -20],
];
function orderedCameras(ids) {
  const score = id => CAMERA_HINTS.reduce((sum, [re, weight]) => sum + (re.test(id) ? weight : 0), 0);
  return [...ids].sort((a, b) => score(b) - score(a) || a.localeCompare(b));
}
function setPrimaryCamera(camera) {
  $('camera-name').textContent = camera;
  for (const [id, card] of Object.entries(cameraCards)) {
    card.classList.toggle('primary', id === camera);
    card.classList.toggle('secondary', id !== camera);
    card.disabled = id === camera;
    (id === camera ? $('primaryCamera') : $('otherCameras')).append(card);
  }
}
function render() {
  if (!data) return;
  const end = Math.max(data.end_ns, 1);
  $('timeline').value = Math.round(currentNs / end * 1000);
  $('time').textContent = seconds(currentNs) + ' / ' + seconds(data.end_ns);
  const active = data.instructions.find(ins => ins.start_ns <= currentNs &&
    (currentNs < ins.end_ns || currentNs === data.end_ns && ins.end_ns === data.end_ns));
  const instruction = active ? active.text : '此时段无指令';
  if ($('instruction').textContent !== instruction) $('instruction').textContent = instruction;
  for (const [camera, stream] of Object.entries(data.cameras)) {
    const index = sampleIndex(stream.times, currentNs);
    const img = document.getElementById('img-' + camera);
    const width = Math.max(160, Math.min(1600, Math.ceil(img.clientWidth * (window.devicePixelRatio || 1))));
    const request = `${index}:${width}`;
    if (index >= 0 && img.dataset.request !== request) {
      img.dataset.loading = '1';
      img.dataset.request = request;
      img.src = frameUrl(data.episode_id, camera, index, width);
    } else if (index < 0 && img.dataset.request) {
      img.removeAttribute('src'); img.dataset.request = ''; img.dataset.loading = '';
    }
    document.getElementById('meta-' + camera).textContent = index < 0
      ? '等待首帧' : `采样于 ${seconds(stream.times[index])}`;
  }
  for (const side of ['left', 'right']) {
    const pose = data.streams[side + '_eef'], gripper = data.streams[side + '_gripper'];
    const poseIndex = sampleIndex(pose.times, currentNs);
    const gripperIndex = sampleIndex(gripper.times, currentNs);
    const openness = gripperIndex < 0 ? null : gripper.values[gripperIndex];
    poseViews[side].setSample(poseIndex, openness);
    document.getElementById('meta-' + side).textContent = poseIndex < 0
      ? '等待首个 TCP 样本' : `采样于 ${seconds(pose.times[poseIndex])}`;
    document.getElementById('gripper-' + side).textContent = openness === null
      ? '夹爪：等待首样本' : `夹爪开合 ${Math.round(openness * 100)}%`;
  }
}
function setup(episode) {
  Object.values(poseViews).forEach(view => view.destroy());
  poseViews = {}; cameraCards = {};
  data = episode; currentNs = 0; setPlaying(false);
  $('primaryCamera').replaceChildren(); $('otherCameras').replaceChildren(); $('poses').replaceChildren();
  const cameras = orderedCameras(Object.keys(data.cameras));
  for (const camera of cameras) {
    const card = document.createElement('button'); card.type = 'button'; card.className = 'camera';
    card.setAttribute('aria-label', `切换到 ${camera} 相机`);
    const img = document.createElement('img'); img.id = 'img-' + camera; img.alt = camera + ' 当前帧';
    img.onload = () => {
      if (!img.isConnected || !img.dataset.request) return;
      img.dataset.loading = ''; render();
    };
    img.onerror = () => {
      if (!img.isConnected || !img.dataset.request) return;
      img.dataset.loading = '';
      setPlaying(false);
      $('error').textContent = `无法解码 ${camera} 的视频帧，请检查 PyAV 和 Pillow。`;
    };
    const title = document.createElement('span'); title.className = 'camera-title'; title.textContent = camera;
    const detail = document.createElement('span'); detail.id = 'meta-' + camera; detail.className = 'detail';
    card.append(img, title, detail);
    card.addEventListener('click', () => { setPrimaryCamera(camera); render(); });
    cameraCards[camera] = card;
  }
  setPrimaryCamera(cameras[0]);
  for (const side of ['left', 'right']) {
    const card = document.createElement('section'); card.className = 'pose';
    const head = document.createElement('div'); head.className = 'pose-head';
    const title = document.createElement('h3'); title.textContent = side === 'left' ? '左臂' : '右臂';
    const reset = document.createElement('button'); reset.type = 'button'; reset.className = 'quiet'; reset.textContent = '重置视角';
    head.append(title, reset);
    const canvas = document.createElement('canvas'); canvas.setAttribute('aria-label', title.textContent + ' 3D 位姿');
    const viewport = document.createElement('div'); viewport.className = 'pose-viewport'; viewport.append(canvas);
    const meta = document.createElement('div'); meta.className = 'pose-meta';
    const time = document.createElement('span'); time.id = 'meta-' + side;
    const gripper = document.createElement('span'); gripper.id = 'gripper-' + side;
    meta.append(time, gripper); card.append(head, viewport, meta); $('poses').append(card);
    poseViews[side] = new Pose3D(canvas, data.streams[side + '_eef'], side);
    reset.addEventListener('click', () => poseViews[side].reset());
  }
  render();
}
async function load(id) {
  const token = ++generation;
  $('error').textContent = '';
  $('instruction').textContent = '正在读取…';
  try {
    const res = await fetch('/api/episode?id=' + encodeURIComponent(id));
    if (!res.ok) throw new Error(await res.text());
    const episode = await res.json();
    if (token === generation) setup(episode);
  } catch (error) { if (token === generation) $('error').textContent = String(error); }
}
function tick(now) {
  if (playing && data) {
    const buffering = Object.keys(data.cameras).some(camera =>
      document.getElementById('img-' + camera).dataset.loading === '1');
    if (!buffering && lastTick) currentNs = Math.min(data.end_ns, currentNs + (now - lastTick) * 1e6);
    if (currentNs >= data.end_ns) setPlaying(false);
    render();
  }
  lastTick = now; requestAnimationFrame(tick);
}
$('timeline').addEventListener('input', () => {
  if (data) { currentNs = Number($('timeline').value) / 1000 * data.end_ns; render(); }
});
$('play').addEventListener('click', () => {
  if (!data) return;
  if (currentNs >= data.end_ns) currentNs = 0;
  setPlaying(!playing);
  render();
});
$('episode').addEventListener('change', event => load(event.target.value));
fetch('/api/dataset').then(async res => {
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}).then(dataset => {
  dataset.episodes.forEach(id => {
    const option = document.createElement('option'); option.value = id; option.textContent = id;
    $('episode').append(option);
  });
  load(dataset.episodes[0]);
}).catch(error => { $('error').textContent = String(error); });
requestAnimationFrame(tick);
</script>
</html>
